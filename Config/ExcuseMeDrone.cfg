# Excuse Me, Drone v1.0.3
# 7 Days to Die v3.2 settings

# Summons a Follow-mode drone at any distance. No menu/UI is opened.
# Unity KeyCode name, e.g. F10, F8, Home. Restart the game after editing.
SummonKey=F10
SummonForwardDistance=1.50
SummonHeightOffset=1.20
# Ground placement searches only 0.75 m above/below the player's feet.
# Walls/ceilings are checked before teleporting; no global height-map lookup.
# Broken-drone initial summon uses player-relative height.
GroundSnapEnabled=true
GroundClearance=0.10
# Broken F10 summon height relative to the player's current Y.
BrokenSummonHeightOffset=0.80
# Required upward movement after the post-revive baseline before re-shutdown.
BrokenLiftThreshold=0.25
# Always leave the temporarily revived drone alive for at least this long.
BrokenMinimumAwakeSeconds=1.50
# Safety timeout if the drone never performs a real upward movement.
BrokenReviveTimeoutSeconds=6.00

# One-shot combat dodge. When a zombie enters this radius, teleport the drone once
# to the left/rear/lower point. Vanilla follow/attack AI resumes immediately.
CombatDodgeEnabled=true
CombatTriggerDistance=5.0
CombatDodgeCooldownSeconds=60.0
ThreatScanInterval=0.25
BehindDistance=0.60
# Negative = player left, positive = player right.
SideOffset=-1.80
HeightOffset=1.10

# Rescue a Follow-mode drone that has barely moved and is too far away,
# or is at least 3 m above/below the player (including nearby other floors).
StuckRescueEnabled=true
StuckDistance=8.0
StuckSeconds=3.0
StuckMovementThreshold=0.20
ImmediateRescueDistance=20.0

# Optional: hide the drone model.
Invisible=false

# Event/rescue logs only. No per-frame spam.
DebugLogging=true

# Broken/shutdown drones: automatic combat dodge and stuck rescue are suppressed.
# F10 places a broken drone at a player-relative height,
# temporarily revives it to Health=2, waits for Vanilla lift, then restores shutdown.
